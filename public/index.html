<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Article Depot</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="masthead">
    <div class="masthead-inner">
      <div class="brand">
        <h1>Article Depot</h1>
        <p>The company reading room</p>
      </div>
      <div class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="search" type="search" placeholder="Search titles, sites, notes" aria-label="Search articles">
      </div>
    </div>
    <p id="status" class="status" role="status"></p>
  </header>

  <main class="library">
    <div id="bookcases" class="bookcases"></div>
  </main>
  <div class="floor">
    <div class="trash" id="trash">
      <section class="trash-panel" id="trash-panel" aria-labelledby="trash-title" inert>
        <header class="trash-panel-header">
          <h2 id="trash-title">Passed articles</h2>
          <p>Click one to read it, or to move it back onto a shelf.</p>
        </header>
        <ul id="trash-list" class="trash-list"></ul>
      </section>

      <button type="button" class="trash-button" id="trash-button" aria-expanded="false" aria-controls="trash-panel">
        <svg class="basket" viewBox="0 0 120 132" aria-hidden="true">
          <defs>
            <linearGradient id="basket-body" x1="0" x2="1">
              <stop offset="0" stop-color="#2e2116"/>
              <stop offset="0.35" stop-color="#7d5f3d"/>
              <stop offset="0.55" stop-color="#a07c50"/>
              <stop offset="1" stop-color="#2a1d12"/>
            </linearGradient>
            <linearGradient id="basket-rim" x1="0" x2="1">
              <stop offset="0" stop-color="#8a6424"/>
              <stop offset="0.45" stop-color="#f0d692"/>
              <stop offset="1" stop-color="#7a5a20"/>
            </linearGradient>
            <radialGradient id="paper" cx="0.35" cy="0.3" r="0.8">
              <stop offset="0" stop-color="#fffaf0"/>
              <stop offset="1" stop-color="#d9ccb2"/>
            </radialGradient>
            <clipPath id="basket-clip"><path d="M13 30 L107 30 L95 124 L25 124 Z"/></clipPath>
          </defs>
          <ellipse class="basket-shadow" cx="60" cy="126" rx="42" ry="5"/>
          <ellipse cx="60" cy="30" rx="46" ry="7" fill="#1a120b"/>
          <g class="papers">
            <circle cx="44" cy="25" r="12" fill="url(#paper)"/>
            <path d="M36 22l6 4 4-6 5 7" stroke="#b9a988" stroke-width="1.2" fill="none"/>
            <circle cx="70" cy="21" r="14" fill="url(#paper)"/>
            <path d="M61 17l7 5 3-7 6 9M64 27l6-3" stroke="#b9a988" stroke-width="1.2" fill="none"/>
            <circle cx="57" cy="29" r="9" fill="url(#paper)"/>
          </g>
          <path d="M13 30 L107 30 L95 124 L25 124 Z" fill="url(#basket-body)"/>
          <g clip-path="url(#basket-clip)" stroke="rgba(255,228,180,0.28)" stroke-width="1" fill="none">
            <path d="M22 30 L32 124M31 30 L39 124M40 30 L46 124M49 30 L53 124M60 30 V124M71 30 L67 124M80 30 L74 124M89 30 L81 124M98 30 L88 124"/>
            <path d="M14 50 H106M15 70 H104M16 90 H102M17 108 H100" stroke="rgba(0,0,0,0.25)"/>
          </g>
          <path d="M24 116 L96 116 L95 124 L25 124 Z" fill="url(#basket-rim)" opacity="0.9"/>
          <ellipse cx="60" cy="30" rx="47" ry="7" fill="none" stroke="url(#basket-rim)" stroke-width="4"/>
          <rect x="42" y="62" width="36" height="16" rx="2.5" fill="url(#basket-rim)" stroke="rgba(60,40,10,0.6)" stroke-width="0.8"/>
          <text x="60" y="73.5" text-anchor="middle" class="basket-label">PASS</text>
        </svg>
        <span class="trash-count" id="trash-count" hidden>0</span>
      </button>
    </div>
  </div>

  <dialog id="book-dialog" class="card-dialog" aria-labelledby="card-title">
    <article class="card">
      <button type="button" class="card-close" id="card-close" aria-label="Close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
      <p class="card-kicker" id="card-kicker"></p>
      <h2 id="card-title" class="card-title"></h2>
      <p id="card-site" class="card-site"></p>
      <p id="card-description" class="card-description"></p>
      <a id="card-link" class="button button-primary" target="_blank" rel="noopener noreferrer">
        Read the article
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8"/></svg>
      </a>

      <div class="card-section">
        <span class="card-label" id="shelf-label">Shelf</span>
        <div class="segmented" id="card-category" role="radiogroup" aria-labelledby="shelf-label"></div>
      </div>

      <div class="card-section">
        <label class="toggle">
          <input type="checkbox" id="card-discuss">
          <span class="toggle-track" aria-hidden="true"><span class="toggle-thumb"></span></span>
          <span class="toggle-text">On the <strong>To Discuss</strong> bookcase</span>
        </label>
      </div>

      <div class="card-section">
        <label class="card-label" for="card-notes">Notes <span id="notes-saved" class="saved"></span></label>
        <textarea id="card-notes" rows="3" placeholder="Add a note for the team…"></textarea>
      </div>

      <footer class="card-footer">
        <button type="button" class="button-text danger" id="card-remove">Remove from the library</button>
      </footer>
    </article>
  </dialog>

  <dialog id="key-dialog" class="card-dialog">
    <form method="dialog" id="key-form" class="card card-small">
      <h2 class="card-title">Team key required</h2>
      <p class="card-description">Enter the team key to open the Article Depot library.</p>
      <input id="key-input" type="password" autocomplete="current-password" required aria-label="Team key">
      <button type="submit" class="button button-primary">Open the library</button>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
